name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testes
        run: dotnet test ConnectDesktop.sln -c Release

      - name: Instalar Inno Setup (se nao existir)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Publicar instalador Windows
        shell: pwsh
        run: ./build/publish-windows.ps1 -Version $env:VERSION -Repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/ConnectDesktop-Setup-win-x64.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publicar macOS arm64
        shell: bash
        run: bash build/publish-mac.sh "$VERSION" "${{ github.repository }}" osx-arm64

      - name: Publicar macOS x64
        shell: bash
        run: bash build/publish-mac.sh "$VERSION" "${{ github.repository }}" osx-x64

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: artifacts/ConnectDesktop-mac-*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publicar Linux x64
        shell: bash
        run: bash build/publish-linux.sh "$VERSION" "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/ConnectDesktop-linux-x64.tar.gz

  release:
    needs: [windows, mac, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Curto SHA
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Connect Desktop v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            ${{ github.event.head_commit.message }}

            Commit: ${{ steps.sha.outputs.short }}
          make_latest: true
          files: |
            dist/ConnectDesktop-Setup-win-x64.exe
            dist/ConnectDesktop-mac-arm64.zip
            dist/ConnectDesktop-mac-x64.zip
            dist/ConnectDesktop-linux-x64.tar.gz
